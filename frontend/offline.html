<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#060f1e" />
<title>دون اتصال — مدارس الإبداع والتميز الدولية</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#13284a 0%,#060f1e 55%);
    color:#eaf2ff;min-height:100vh;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:24px}
  .box{max-width:480px}
  .ico{font-size:64px;margin-bottom:18px}
  h1{font-size:26px;font-weight:800;margin-bottom:12px}
  p{color:#9fb3d1;font-size:16px;line-height:1.9;margin-bottom:24px}
  button{background:linear-gradient(135deg,#3da9fc,#1b6fd6);color:#fff;border:0;
    border-radius:14px;padding:14px 28px;font-size:16px;font-weight:700;cursor:pointer}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
  <div class="box">
    <div class="ico">📴</div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>هذه الصفحة لم تُفتح من قبل لتُخزَّن محلياً.<br>
       افتح الصفحات وأنت متصل مرة واحدة لتعمل دون اتصال لاحقاً.<br>
       بياناتك المحفوظة وعملياتك المعلّقة آمنة وستُزامَن عند عودة الاتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
