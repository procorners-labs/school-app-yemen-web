<!-- حارس الإقلاع: إن تجمّدت الشبكة ولم يكتمل التحميل خلال 15s، أظهِر زرّ
     إعادة المحاولة بدل شاشة بيضاء لا نهائية (بلا أي اعتماد خارجي).
     يُحتسب اكتمال DOM (وليس load الكامل) نجاحاً — الصور البطيئة تؤخّر load
     على شبكات 2G/3G فكان الإنذار يظهر فوق تطبيقٍ يعمل («الشبكة محجوبة» الكاذبة). -->
<script>
  (function(){
    var SHOWN=false;
    function dismiss(){clearTimeout(TID);var x=document.getElementById("__bootfail");if(x)x.parentNode.removeChild(x);}
    var TID=setTimeout(function(){
      if(SHOWN||!document.body||document.getElementById("__bootfail"))return;
      if(document.readyState!=="loading")return;
      SHOWN=true;
      var d=document.createElement("div");d.id="__bootfail";
      d.setAttribute("style","position:fixed;inset:0;z-index:2147483647;background:#0b1930;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;text-align:center;padding:24px");
      d.innerHTML='<div style="font-size:46px">📡</div><div style="font-size:18px;font-weight:700;margin:12px 0">تعذّر تحميل التطبيق</div><div style="opacity:.85;max-width:330px;line-height:1.8">يبدو أن الاتصال بطيء أو محجوب على هذه الشبكة. جرّب إعادة المحاولة أو شبكة أخرى.</div><button onclick="location.reload()" style="margin-top:18px;background:#1a5ec7;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:15px;cursor:pointer">🔄 إعادة المحاولة</button>';
      document.body.appendChild(d);
    },25000);
    document.addEventListener("DOMContentLoaded",dismiss);
    window.addEventListener("load",dismiss);
  })();
</script>

<script>
  // ★ استخراج schoolId من الرابط لدعم تعدد المدارس (Multi-Tenant)
  (function() {
    var urlParams = new URLSearchParams(window.location.search);
    window.SCHOOL_ID = urlParams.get('school') || '';
  })();

  // Worker-aware navigation — يبني رابط الصفحة مباشرةً عبر Worker
  var _CMS_PAGE_MAP = { '': '/cms/index.html', 'add': '/cms/add.html', 'view': '/cms/view.html', 'audit': '/cms/audit.html', 'reports': '/cms/audit.html', 'qr': '/cms/qr.html' };
  window.goToPage = function(p) {
    var sid = window.SCHOOL_ID || '';
    if (window.GAS_ENDPOINT) {
      var dest = _CMS_PAGE_MAP[p] || '/cms/index.html';
      window.top.location.href = dest + (sid ? '?school=' + encodeURIComponent(sid) : '');
      return;
    }
    google.script.run.withSuccessHandler(function(url) {
      if (sid) url += (url.indexOf('?') > -1 ? '&' : '?') + 'school=' + encodeURIComponent(sid);
      window.top.location.href = url;
    }).withFailureHandler(function(e) { console.error('goToPage:', e); }).getPageUrl(p);
  };

  // التبويبات
  document.querySelectorAll('.tab').forEach(function(t){
    t.addEventListener('click', function(){
      var id = this.dataset.section;
      document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
      document.querySelectorAll('.tab').forEach(function(b){ b.classList.remove('active'); });
      document.getElementById(id).classList.add('active');
      this.classList.add('active');
    });
  });

  function formatDate(d) { if (!d) return ''; try { return new Date(d).toLocaleString('ar-SA'); } catch(e) { return String(d); } }
  function esc(t) { if (t == null) return ''; var div = document.createElement('div'); div.textContent = String(t); return div.innerHTML; }

  // ── مكتبة المحتوى: بحث + تحويل عنصر إلى مسودة منشور ──
  var _lib = { news: [], videos: [], images: [] };
  function libFilter(q) {
    q = (q || '').trim();
    var active = document.querySelector('.section.active');
    if (!active) return;
    var cards = active.querySelectorAll('.card');
    for (var i = 0; i < cards.length; i++) {
      cards[i].style.display = (!q || cards[i].textContent.indexOf(q) >= 0) ? '' : 'none';
    }
  }
  // البطاقات معروضة بترتيب عكسي (الأحدث أولاً) → فهرس العنصر = الطول-1-الموضع
  function libAttachConvert(grid, kind, data) {
    if (!grid || !data) return;
    var cards = grid.querySelectorAll('.card');
    for (var p = 0; p < cards.length; p++) {
      var item = data[data.length - 1 - p];
      if (!item) continue;
      (function (it, card) {
        var btn = document.createElement('button');
        btn.textContent = '🔁 حوّل لمنشور';
        btn.style.cssText = 'background:#0f3b5c;color:#fff;border:none;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit;margin-top:8px;';
        btn.onclick = function () { cmsConvertItem(kind, it); };
        card.appendChild(btn);
      })(item, cards[p]);
    }
  }
  function cmsConvertItem(kind, r) {
    var title = r.title || r.name || '';
    var body  = r.content || r.description || '';
    var media = r.mediaURL || r.videoURL || r.imageURL || '';
    if (!confirm('إنشاء مسودة منشور من: ' + title + '؟')) return;
    google.script.run
      .withSuccessHandler(function (m) { alert(m); })
      .withFailureHandler(function (e) { alert('فشل: ' + e.message); })
      .addManualDraft(kind, title, body, media, 'CMS', '', window.SCHOOL_ID);
  }

  // عرض الأخبار
  function displayNews(data) {
    var grid = document.getElementById('newsGrid');
    if (!data || data.length === 0) { grid.innerHTML = '<div class="empty-state">📭 لا توجد أخبار بعد</div>'; return; }
    var html = '';
    for (var i = data.length - 1; i >= 0; i--) {
      var r = data[i]; if (!r) continue;
      html += '<div class="card"><h3>' + esc(r.title) + '</h3><p>' + esc(r.content) + '</p>';
      if (r.mediaURL && r.mediaType === 'Image') html += '<img src="' + esc(r.mediaURL) + '" loading="lazy">';
      html += '<div class="meta"><span>📅 ' + formatDate(r.timestamp) + '</span><span class="badge">👤 ' + esc(r.userName || r.userEmail || 'مجهول') + '</span></div></div>';
    }
    grid.innerHTML = html;
    _lib.news = data; libAttachConvert(grid, 'news', data);
  }

  // عرض الفيديوهات (مع دعم فيسبوك/إنستغرام)
  function displayVideos(data) {
    var grid = document.getElementById('videosGrid');
    if (!data || data.length === 0) { grid.innerHTML = '<div class="empty-state">🎬 لا توجد فيديوهات</div>'; return; }
    var html = '';
    for (var i = data.length - 1; i >= 0; i--) {
      var r = data[i]; if (!r) continue;
      var embed = '';
      if (r.videoURL) {
        var u = r.videoURL;
        var isFacebook = u.indexOf('facebook.com') !== -1 || u.indexOf('fb.com') !== -1;
        var isInstagram = u.indexOf('instagram.com') !== -1;
        if (u.indexOf('youtube.com/watch') !== -1) {
          var id = u.split('v=')[1]; if (id) { var amp = id.indexOf('&'); if (amp !== -1) id = id.substring(0,amp); embed = '<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/' + id + '" allowfullscreen loading="lazy"></iframe></div>'; }
        } else if (u.indexOf('youtu.be/') !== -1) {
          var id = u.split('youtu.be/')[1]; if (id) { var q = id.indexOf('?'); if (q !== -1) id = id.substring(0,q); embed = '<div class="video-wrapper"><iframe src="https://www.youtube.com/embed/' + id + '" allowfullscreen loading="lazy"></iframe></div>'; }
        } else if (u.indexOf('drive.google.com') !== -1) {
          var dm = u.match(/[?&]id=([a-zA-Z0-9_-]+)/) || u.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (dm && dm[1]) {
            // بثّ عبر وسيط الـWorker /media/drive في <video> الأصلي، وتراجع لمشغّل Drive (/preview) عند الفشل
            var _wb = (window.GAS_ENDPOINT && window.GAS_ENDPOINT.charAt(0) === '/') ? '' : 'https://school.procorners.com';
            embed = '<div class="video-wrapper"><video src="' + _wb + '/media/drive/' + dm[1] + '" controls playsinline preload="metadata" style="width:100%;height:100%;background:#000" ' +
              'onerror="this.parentNode.innerHTML=\'<iframe src=&quot;https://drive.google.com/file/d/' + dm[1] + '/preview&quot; allowfullscreen loading=lazy></iframe>\'"></video></div>';
          } else {
            embed = '<div class="video-wrapper"><iframe src="' + u.replace('/view?usp=sharing','/preview') + '" allowfullscreen loading="lazy"></iframe></div>';
          }
        } else if (isFacebook) {
          embed = '<div class="social-preview">' +
                    '<div class="social-icon">📘</div>' +
                    '<div class="social-name">فيسبوك</div>' +
                    '<a href="' + esc(u) + '" target="_blank" class="social-link-btn">🔗 مشاهدة الفيديو على فيسبوك</a>' +
                  '</div>';
        } else if (isInstagram) {
          embed = '<div class="social-preview">' +
                    '<div class="social-icon">📷</div>' +
                    '<div class="social-name">إنستغرام</div>' +
                    '<a href="' + esc(u) + '" target="_blank" class="social-link-btn">🔗 مشاهدة الفيديو على إنستغرام</a>' +
                  '</div>';
        } else {
          embed = '<p><a href="' + esc(u) + '" target="_blank" class="social-link-btn" style="margin-top:12px;">🔗 رابط الفيديو</a></p>';
        }
      }
      html += '<div class="card"><h3>' + esc(r.title) + '</h3><p>' + esc(r.description) + '</p>' + embed;
      html += '<div class="meta"><span>📅 ' + formatDate(r.timestamp) + '</span><span class="badge">👤 ' + esc(r.userName || r.userEmail || 'مجهول') + '</span></div></div>';
    }
    grid.innerHTML = html;
    _lib.videos = data; libAttachConvert(grid, 'video', data);
  }

  // عرض الصور
  function displayImages(data) {
    var grid = document.getElementById('imagesGrid');
    if (!data || data.length === 0) { grid.innerHTML = '<div class="empty-state">🖼️ لا توجد صور</div>'; return; }
    var html = '';
    for (var i = data.length - 1; i >= 0; i--) {
      var r = data[i]; if (!r) continue;
      html += '<div class="card"><h3>' + esc(r.name) + '</h3><p>' + esc(r.description) + '</p>';
      if (r.imageURL) html += '<img src="' + esc(r.imageURL) + '" loading="lazy">';
      html += '<div class="meta"><span>📅 ' + formatDate(r.timestamp) + '</span><span class="badge">👤 ' + esc(r.userName || r.userEmail || 'مجهول') + '</span></div></div>';
    }
    grid.innerHTML = html;
    _lib.images = data; libAttachConvert(grid, 'image', data);
  }

  // جلب المحتوى
  function fetchContent(fnName, gridId, displayFn) {
    var grid = document.getElementById(gridId);
    grid.innerHTML = '<div class="loading-spinner">⏳ جاري التحميل...</div>';
    google.script.run
      .withSuccessHandler(function(data) {
        if (!data) { grid.innerHTML = '<div class="empty-state">⚠️ تعذر جلب البيانات</div>'; return; }
        displayFn(data);
      })
      .withFailureHandler(function(err) {
        grid.innerHTML = '<div class="empty-state">⚠️ فشل الاتصال</div>';
      })
      [fnName]();
  }

  function updateMiniStats(stats) {
    if (!stats) return;
    var container = document.getElementById('statsMiniContainer');
    var values = [stats.News || 0, stats.Videos || 0, stats.Images || 0, stats.Schedule || 0];
    var labels = ['أخبار', 'فيديوهات', 'صور', 'منشورات مجدولة'];
    var html = '';
    for (var i = 0; i < 4; i++) {
      html += '<div class="stat-tile"><div class="stat-value">' + values[i] + '</div><div class="stat-label">' + labels[i] + '</div></div>';
    }
    container.innerHTML = html;
  }

  function loadStats() {
    // ✅ تمرير schoolId لعرض إحصائيات المدرسة الصحيحة
    google.script.run.withSuccessHandler(updateMiniStats).getSystemStats(window.SCHOOL_ID);
  }

  // ── عارض جداول الشيت الديناميكي ──
  var _sheetRows = [];
  function loadSheetsList() {
    google.script.run
      .withSuccessHandler(function (res) {
        var sel = document.getElementById('sheetSelect'); if (!sel) return;
        if (!res || !res.success) { sel.innerHTML = '<option value="">تعذّر التحميل</option>'; return; }
        var o = '<option value="">— اختر ورقة —</option>';
        for (var i = 0; i < res.sheets.length; i++) {
          var s = res.sheets[i];
          o += '<option value="' + esc(s.name) + '">' + esc(s.name) + ' (' + s.rows + ' صف)</option>';
        }
        sel.innerHTML = o;
      })
      .withFailureHandler(function () { var sel = document.getElementById('sheetSelect'); if (sel) sel.innerHTML = '<option value="">تعذّر الاتصال</option>'; })
      .cmsListSheets();
  }
  function showSheet(name) {
    var wrap = document.getElementById('sheetTableWrap'); if (!wrap) return;
    if (!name) { wrap.innerHTML = '<div class="empty-state" style="padding:30px;color:#94a3b8;">اختر ورقة لعرض بياناتها</div>'; return; }
    wrap.innerHTML = '<div class="loading-spinner">⏳ جاري تحميل الورقة...</div>';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.success) { wrap.innerHTML = '<div class="empty-state" style="padding:24px;color:#dc2626;">❌ ' + (res ? esc(res.error) : 'خطأ') + '</div>'; return; }
        _sheetRows = res.rows || [];
        renderSheetTable(res);
      })
      .withFailureHandler(function () { wrap.innerHTML = '<div class="empty-state" style="padding:24px;color:#dc2626;">❌ فشل الاتصال</div>'; })
      .cmsGetSheetData(name, 300);
  }
  function renderSheetTable(res) {
    var wrap = document.getElementById('sheetTableWrap'); if (!wrap) return;
    if (!res.headers || !res.headers.length) { wrap.innerHTML = '<div class="empty-state" style="padding:24px;color:#94a3b8;">ورقة فارغة</div>'; return; }
    var h = '<table style="width:100%;border-collapse:collapse;font-size:14px;"><thead><tr>';
    for (var c = 0; c < res.headers.length; c++) {
      h += '<th style="position:sticky;top:0;background:#0f3b5c;color:#fff;padding:9px 12px;text-align:right;white-space:nowrap;">' + esc(res.headers[c]) + '</th>';
    }
    h += '</tr></thead><tbody id="sheetTbody">' + _sheetRowsHtml(res.rows) + '</tbody></table>';
    h += '<div style="padding:10px 14px;color:#64748b;font-size:13px;">عرض ' + res.shown + ' من ' + res.total + ' صف' + (res.total > res.shown ? ' (الحد 300)' : '') + '</div>';
    wrap.innerHTML = h;
  }
  function _sheetRowsHtml(rows) {
    var b = '';
    for (var r = 0; r < rows.length; r++) {
      b += '<tr style="border-bottom:1px solid #eef2f7;">';
      for (var c = 0; c < rows[r].length; c++) {
        b += '<td style="padding:8px 12px;border-left:1px solid #f1f5f9;max-width:340px;overflow:hidden;text-overflow:ellipsis;">' + esc(rows[r][c]) + '</td>';
      }
      b += '</tr>';
    }
    return b;
  }
  function sheetFilter(q) {
    q = (q || '').trim();
    var tb = document.getElementById('sheetTbody'); if (!tb) return;
    var trs = tb.getElementsByTagName('tr');
    for (var i = 0; i < trs.length; i++) { trs[i].style.display = (!q || trs[i].textContent.indexOf(q) >= 0) ? '' : 'none'; }
  }

  function loadAllContent() {
    loadStats();
    loadSheetsList();
    fetchContent('getNewsData', 'newsGrid', displayNews);
    fetchContent('getVideosData', 'videosGrid', displayVideos);
    fetchContent('getImagesData', 'imagesGrid', displayImages);
  }

  window.refreshAllContent = function() {
    loadAllContent();
  };

  window.onload = function() {
    loadAllContent();
  };
</script>
</body>
</html>
