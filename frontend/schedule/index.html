<!-- حارس الإقلاع: إن تجمّدت الشبكة ولم يكتمل التحميل خلال 15s، أظهِر زرّ
     إعادة المحاولة بدل شاشة بيضاء لا نهائية (بلا أي اعتماد خارجي).
     يُحتسب اكتمال DOM (وليس load الكامل) نجاحاً — الصور البطيئة تؤخّر load
     على شبكات 2G/3G فكان الإنذار يظهر فوق تطبيقٍ يعمل («الشبكة محجوبة» الكاذبة). -->
<script>
  (function(){
    var SHOWN=false;
    function dismiss(){clearTimeout(TID);var x=document.getElementById("__bootfail");if(x)x.parentNode.removeChild(x);}
    var TID=setTimeout(function(){
      if(SHOWN||!document.body||document.getElementById("__bootfail"))return;
      if(document.readyState!=="loading")return;
      SHOWN=true;
      var d=document.createElement("div");d.id="__bootfail";
      d.setAttribute("style","position:fixed;inset:0;z-index:2147483647;background:#0b1930;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;text-align:center;padding:24px");
      d.innerHTML='<div style="font-size:46px">📡</div><div style="font-size:18px;font-weight:700;margin:12px 0">تعذّر تحميل التطبيق</div><div style="opacity:.85;max-width:330px;line-height:1.8">يبدو أن الاتصال بطيء أو محجوب على هذه الشبكة. جرّب إعادة المحاولة أو شبكة أخرى.</div><button onclick="location.reload()" style="margin-top:18px;background:#1a5ec7;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:15px;cursor:pointer">🔄 إعادة المحاولة</button>';
      document.body.appendChild(d);
    },25000);
    document.addEventListener("DOMContentLoaded",dismiss);
    window.addEventListener("load",dismiss);
  })();
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>توزيع الحصص — انتقل إلى منصّة المعلّم | يمن سكولز</title>

<!-- 🔴 بصمةُ التقاعد — عقدٌ بين المستودعين لا زينة. تفحصها بوّابةُ مستودع الوركر
     قبل الدمج بشقَّين: حضورُ الوسم أدناه، وغيابُ معرّفِ نافذةِ الإسناد التي كانت
     في الصفحة القديمة.
     ⚠️ ووسمُ `meta` اختيرَ بدل نصٍّ مرئيّ عمداً: المرئيُّ يُحرَّر تجميلياً فيُكسَر
     الفحصُ بلا أن يتغيّر شيءٌ في المعنى.
     🔴 **ولا يُذكر معرّفُ الغياب هنا حرفياً** — التعليقاتُ تنجو إلى المخرَج، فذِكرُه
     يجعل الصفحةَ الجديدة **تحمل البصمةَ التي يُشترَط غيابُها** ⇒ الفحصُ يحمرّ على
     صفحةٍ سليمة. وقع فعلاً في أوّل صياغةٍ لهذا الملفّ وكشفه `grep` على المخرَج
     المبنيّ لا على المصدر. لا تُعدِّل هذا السطر ولا تنقله. -->
<meta name="x-page" content="schedule-retired">

<!-- 🔴 قانونيٌّ ساكنٌ — والوركرُ لا يحقن هنا: `_canonicalFor` يُرجِع `''` لكلّ ما ليس
     صفحةَ مدرسة (فرعان فقط يُنتجان قيمة). فلو لم يُكتب هنا لبقيت الصفحةُ بلا قانونيّ. -->
<link rel="canonical" href="https://yemenschoolz.com/schedule">
<meta property="og:site_name" content="Yemen Schoolz">
<meta name="description" content="صفحةُ توزيع الحصص انتقلت إلى منصّة المعلّم — إعدادات الجدول والتواقيت.">

<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --fg:#1a2233; --muted:#5b6880;
    --brand:#0f766e; --brand-fg:#ffffff; --line:#e2e8f0;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1523; --card:#182031; --fg:#e8eef7; --muted:#9aa8bd;
      --brand:#2dd4bf; --brand-fg:#06251f; --line:#28324a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
    font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.9;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    max-width:560px; width:100%; padding:32px 28px; text-align:center;
    box-shadow:0 8px 28px rgba(0,0,0,.07);
  }
  .icon{font-size:44px; line-height:1; margin-bottom:12px}
  h1{font-size:1.35rem; margin:0 0 10px}
  p{color:var(--muted); margin:0 0 18px; font-size:.98rem}
  .go{
    display:inline-block; background:var(--brand); color:var(--brand-fg);
    text-decoration:none; font-weight:700; padding:12px 26px; border-radius:10px;
  }
  .go:hover{opacity:.92}
  .where{
    margin-top:22px; padding-top:16px; border-top:1px solid var(--line);
    font-size:.86rem; color:var(--muted);
  }
  .where b{color:var(--fg); font-weight:600}
</style>
</head>
<body>
  <main class="card">
    <div class="icon">🗓️</div>
    <h1>توزيع الحصص انتقل إلى منصّة المعلّم</h1>
    <p>
      لم تعد هذه الصفحةُ مستقلّةً. صار محرّرُ الجدول جزءاً من منصّة المعلّم،
      فتُدار الحصصُ والمعلّمون والفصولُ من مكانٍ واحد ببياناتٍ واحدة.
    </p>

    <!-- 🔴 رابطٌ داخليٌّ صريح — **لا 301 ولا تحويل تلقائيّ**.
         السببُ سلوكُ تطبيقَي الأندرويد: `AppConfig.kt::matchesDeployment` يطابق
         `/(home|student|teacher|cms|schedule)/` **ويتجاهل المضيف** ⇒ `/teacher/index.html`
         يُطابِق فيبقى المستخدمُ داخل التطبيق.
         ⚠️ ولا يُستبدَل بـ`/portal`: لا يطابق الـregex ⇒ يفتح المتصفّحَ ويترك التطبيق. -->
    <a class="go" href="/teacher/index.html">الانتقال إلى منصّة المعلّم</a>

    <div class="where">
      مكانُها هناك: <b>إعدادات الجدول والتواقيت ← توزيع الحصص</b>
      <br>(للمدير والوكيل)
    </div>
  </main>
</body>
</html>
