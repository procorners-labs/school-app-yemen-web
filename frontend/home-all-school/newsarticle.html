<!-- حارس الإقلاع: إن تجمّدت الشبكة ولم يكتمل التحميل خلال 15s، أظهِر زرّ
     إعادة المحاولة بدل شاشة بيضاء لا نهائية (بلا أي اعتماد خارجي).
     يُحتسب اكتمال DOM (وليس load الكامل) نجاحاً — الصور البطيئة تؤخّر load
     على شبكات 2G/3G فكان الإنذار يظهر فوق تطبيقٍ يعمل («الشبكة محجوبة» الكاذبة). -->
<script>
  (function(){
    var SHOWN=false;
    function dismiss(){clearTimeout(TID);var x=document.getElementById("__bootfail");if(x)x.parentNode.removeChild(x);}
    var TID=setTimeout(function(){
      if(SHOWN||!document.body||document.getElementById("__bootfail"))return;
      if(document.readyState!=="loading")return;
      SHOWN=true;
      var d=document.createElement("div");d.id="__bootfail";
      d.setAttribute("style","position:fixed;inset:0;z-index:2147483647;background:#0b1930;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',Tahoma,system-ui,sans-serif;text-align:center;padding:24px");
      d.innerHTML='<div style="font-size:46px">📡</div><div style="font-size:18px;font-weight:700;margin:12px 0">تعذّر تحميل التطبيق</div><div style="opacity:.85;max-width:330px;line-height:1.8">يبدو أن الاتصال بطيء أو محجوب على هذه الشبكة. جرّب إعادة المحاولة أو شبكة أخرى.</div><button onclick="location.reload()" style="margin-top:18px;background:#1a5ec7;color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:15px;cursor:pointer">🔄 إعادة المحاولة</button>';
      document.body.appendChild(d);
    },25000);
    document.addEventListener("DOMContentLoaded",dismiss);
    window.addEventListener("load",dismiss);
  })();
</script>

<title>خبر — يمن سكولز</title>
<style>
@font-face {
  font-family: 'Cairo';
  src: url('../assets/Cairo-Variable.ttf') format('truetype-variations');
  font-weight: 200 1000;
  font-style: normal;
  font-display: swap;
}
:root{
  --bg:#f2f6fd; --surface:#ffffff; --border:rgba(17,73,163,.12);
  --tx:#06111f; --tx2:#253d60; --tx3:#5d7a9e; --cobalt:#1149a3;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--cobalt);font-weight:700;text-decoration:none;margin-bottom:18px;font-size:.95rem;}
.back:hover{text-decoration:underline;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.brand img{width:40px;height:40px;border-radius:10px;object-fit:contain;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);}
.brand span{font-weight:800;color:var(--tx);font-size:1rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 10px 34px rgba(0,0,0,.08);}
.gal{position:relative;height:300px;border-radius:14px;overflow:hidden;background:var(--bg);margin-bottom:16px;}
.slide{position:absolute;inset:0;}
.slide img{width:100%;height:100%;object-fit:cover;}
.gal-nav button{position:absolute;top:50%;transform:translateY(-50%);z-index:3;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:20px;}
.gal-nav .prev{right:8px}
.gal-nav .next{left:8px}
.gal-cnt{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:.7rem;padding:2px 9px;border-radius:10px;}
h1{font-size:1.35rem;font-weight:800;line-height:1.65;margin:6px 0;}
.meta{color:var(--tx3);font-size:.85rem;margin-bottom:14px;}
.content{color:var(--tx2);line-height:1.9;white-space:pre-wrap;font-size:1.02rem;}
.state{text-align:center;padding:60px 20px;color:var(--tx3);}
.state.err h2{color:var(--tx);margin:14px 0 8px;}
.spin{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--cobalt);border-radius:50%;margin:0 auto 14px;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.playbtn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#000;}
.playbtn i{width:56px;height:56px;border-radius:50%;background:rgba(232,56,79,.92);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-style:normal;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" id="backLink" href="index.html">→ العودة للرئيسية</a>
  <div class="brand" id="brandBox" style="display:none">
    <img id="brandLogo" src="" alt="" onerror="this.style.display='none'">
    <span id="brandName"></span>
  </div>
  <div id="root">
    <div class="state"><div class="spin"></div>جارٍ تحميل الخبر…</div>
  </div>
</div>
<script>
function esc(s){s=String(s==null?'':s);return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function qparam(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}
function ytId(u){var m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/))([a-zA-Z0-9_-]{6,})/);return m?m[1]:'';}
function drvId(u){var m=String(u||'').match(/[?&]id=([a-zA-Z0-9_-]+)/)||String(u||'').match(/\/d\/([a-zA-Z0-9_-]+)/);return m?m[1]:'';}
function drvVideoSrc(fid){
  var base=(window.GAS_ENDPOINT && window.GAS_ENDPOINT.charAt(0)==='/')?'':'https://yemenschoolz.com';
  return base+'/media/drive/'+fid;
}
function videoPoster(u){
  var yt=ytId(u);
  if(yt) return '<img src="https://img.youtube.com/vi/'+yt+'/hqdefault.jpg" referrerpolicy="no-referrer" loading="lazy">';
  var d=drvId(u);
  if(d) return '<img src="https://lh3.googleusercontent.com/d/'+d+'=w1000" referrerpolicy="no-referrer" loading="lazy">';
  return '';
}
function videoEmbed(u){
  var yt=ytId(u);
  if(yt) return '<iframe src="https://www.youtube-nocookie.com/embed/'+yt+'?autoplay=1&rel=0" style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
  var d=drvId(u);
  if(d) return '<video src="'+drvVideoSrc(d)+'" controls autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;background:#000;"></video>';
  if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u)) return '<video src="'+esc(u)+'" controls autoplay playsinline style="position:absolute;inset:0;width:100%;height:100%;background:#000;"></video>';
  return '<a href="'+esc(u)+'" target="_blank" rel="noopener" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;">فتح الفيديو ↗</a>';
}
function playVideo(el){
  var u = el.getAttribute('data-vurl'); if (!u) return;
  el.innerHTML=videoEmbed(u);el.onclick=null;
}
function galNav(gid,dir){
  var g=document.getElementById(gid); if(!g) return;
  var slides=g.querySelectorAll('.slide'); var n=slides.length; if(!n) return;
  var cur=parseInt(g.getAttribute('data-cur')||'0',10);
  cur=(cur+dir+n)%n;
  for(var i=0;i<n;i++) slides[i].style.display=(i===cur)?'block':'none';
  g.setAttribute('data-cur',String(cur));
  var cnt=document.getElementById(gid+'-cnt'); if(cnt) cnt.textContent=(cur+1)+'/'+n;
}
function buildGallery(media){
  if(!media || !media.length) return '';
  var gid='artGal', s='';
  for(var i=0;i<media.length;i++){
    var m=media[i], disp=(i===0)?'block':'none', inner;
    if(m.type==='video'){
      // data-vurl (سمة HTML، مُهرَّبة عبر esc()) بدل تضمين الرابط داخل سلسلة onclick النصّية —
      // تفادي كسر حدود سلسلة JS بعلامة اقتباس مفردة حرفية داخل الرابط (نمط آمن مطابق لـ
      // _homePlayVideo في home/Index.html).
      inner='<div class="playbtn" data-vurl="'+esc(m.url)+'" onclick="playVideo(this)">'+videoPoster(m.url)+'<i>&#9658;</i></div>';
    } else {
      inner='<img src="'+esc(m.url)+'" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">';
    }
    s+='<div class="slide" style="display:'+disp+';">'+inner+'</div>';
  }
  var nav = media.length>1
    ? ('<div class="gal-nav"><button class="prev" onclick="galNav(\''+gid+'\',-1)" aria-label="السابق">‹</button>'
      +'<button class="next" onclick="galNav(\''+gid+'\',1)" aria-label="التالي">›</button>'
      +'<span class="gal-cnt" id="'+gid+'-cnt">1/'+media.length+'</span></div>')
    : '';
  return '<div class="gal" id="'+gid+'" data-cur="0">'+s+nav+'</div>';
}
function renderArticle(n){
  document.title = (n.title||'خبر') + ' — يمن سكولز';
  var root=document.getElementById('root');
  root.innerHTML =
    buildGallery(n.media||[]) +
    '<div class="card">' +
      '<h1>'+esc(n.title||'خبر')+'</h1>' +
      (n.date ? ('<div class="meta">'+esc(n.date)+(n.author?(' — '+esc(n.author)):'')+'</div>') : '') +
      '<div class="content">'+esc(n.content||'')+'</div>' +
    '</div>';
  if (n.schoolName) {
    var bn = document.getElementById('brandName'); if (bn) bn.textContent = n.schoolName;
    var bb = document.getElementById('brandBox'); if (bb) bb.style.display = 'flex';
    if (n.schoolLogo) { var bl = document.getElementById('brandLogo'); if (bl) bl.src = n.schoolLogo; }
  }
}
function renderError(){
  document.getElementById('root').innerHTML =
    '<div class="state err">' +
      '<div style="font-size:2.6rem;">&#128274;</div>' +
      '<h2>هذا الرابط غير صالح أو منتهي</h2>' +
      '<p>قد يكون الخبر قد حُذف أو أن رابط المشاركة غير صحيح.</p>' +
    '</div>';
}
(function(){
  var school = qparam('school') || qparam('schoolId');
  var backHref = school ? ('index.html?school='+encodeURIComponent(school)) : 'index.html';
  var backEl = document.getElementById('backLink');
  if (backEl) backEl.setAttribute('href', backHref);
  var newsId = qparam('news');
  if (!newsId) { renderError(); return; }
  var token = qparam('t');
  google.script.run
    .withSuccessHandler(function(r){ if (r && r.ok) renderArticle(r); else renderError(); })
    .withFailureHandler(function(){ renderError(); })
    .getSharedNewsFull(newsId, school, token);
})();
</script>
</body>
