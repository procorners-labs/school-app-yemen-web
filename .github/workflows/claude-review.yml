name: Claude Auto Review

# مراجعةٌ تلقائية بـ`claude[bot]` على هذا المستودع — أُنشئ 2026-09-10.
#
# 🔴 **وهو نقضٌ لقرارٍ مكتوبٍ في `claude.yml`، والمقدّمةُ هي التي بطَلت لا القرار:**
#    كان مكتوباً هناك «لا `claude-review.yml` هنا **عمداً** … هذا المستودع يتلقّى دفعاً
#    آلياً مباشراً لا PRs ⇒ مراجعةٌ عند فتح PR **بلا مادّة**».
#    **والمقيس (2026-09-10 · نافذةُ ٣٠ يوماً):** ‏**١٠٠ PR مدموجاً** (بلغ حدَّ الاستعلام)
#    **منها ٢٨ تمسّ `worker/`** ⇒ **المادّةُ موجودةٌ بكثافة، والمقدّمةُ كانت صحيحةً يومَ
#    كُتبت وبطَلت بتغيّر طريقة العمل.**
# 🎯 **والدرسُ يُقال لأنه أعمُّ من الملفّ: تعليلٌ صحيحٌ يُجمّد قدرةً، ثمّ يتقادم تعليلُه
#    ولا يتقادم أثرُه** — فتبقى القدرةُ مطفأةً بحجّةٍ لم تُعَد قياساً. ⇒ **كلُّ «عمداً»
#    في إعدادٍ يحمل مقدّمةً قابلةً للقياس تُعاد قياساً، لا تُقرأ حكماً باقياً.**
#
# ⚠️ **وحدُّ القدرة السابقة مقيسٌ أيضاً:** تشغيلاتُ `claude.yml` = **٧٠ متخطّىً مقابل
#    ٢ ناجحاً** ⇒ الاستدعاءُ اليدويُّ بـ`@claude` **قدرةٌ قائمةٌ لا مستعملة**، والتلقائيُّ
#    هو ما يجعلها تعمل بلا أن يتذكّرها أحد. **والاثنان يبقيان: هذا للفتح، وذاك للسؤال.**
#
# 🔴 **ولماذا `opened, ready_for_review` ولا `synchronize`** — منقولٌ بحرفه من الشقيق:
#    `synchronize` يُطلق مراجعةً عند **كلّ دفعةٍ** على الفرع ⇒ استنزافُ حصّة.
#    ⇒ مراجعةٌ عند الفتح وأخرى عند الخروج من المسوّدة. وللطلب في أيّ لحظةٍ أخرى:
#    علّق `@claude` (‏`claude.yml`).
#    ⚠️ **وثمنُه مُعلَنٌ لا مسكوتٌ عنه:** غيابُ `synchronize` **يؤجّل الاكتشافَ** —
#    تعديلٌ يُدفَع بعد المراجعة لا يُراجَع (فئةُ «عطبٌ لا يظهر لأن ما يكشفه لا يجري»).
#
# 🔴 **وثلاثةُ فوارقَ عن نسخة الشقيق — تُعلَن هنا كي لا تُقرأ تباعداً صامتاً:**
#    ① `paths-ignore` يضيف **`frontend/**` و`media/**`** — مخرَجٌ مولَّدٌ لا مصدر،
#      و`frontend/teacher/index.html` وحدَه **2,016,145 حرفاً** ⇒ مراجعتُه كلفةٌ بلا عائد.
#    ② ثوابتُ المطالبة **ثوابتُ وركرٍ لا ثوابتُ GAS/ES5** — سطحان مختلفان.
#    ③ **فرعُ «الملفُّ جديدٌ على الفرع»** في البوّابة: نسخةُ الشقيق تفحص **اختلافَ**
#      بصمتَي الملفّ، و`sha_base` **فارغٌ حين يُنشأ الملفُّ أوّلَ مرّة** ⇒ تسقط الحالةُ إلى
#      رسالةٍ عامّةٍ تُخفي السبب. 🟢 **وهذا إصلاحٌ يُنقَل إلى الشقيق أيضاً** — فالنسخةُ
#      قيمتُها أنها قراءةٌ ثانية، والقراءةُ الثانية أوّلُ ما كشف.

on:
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '_docs/**'
      - 'frontend/**'
      - 'media/**'

# إعادةُ فتحٍ أو خروجٌ من مسوّدة يُلغي المراجعة السابقة — هنا الإلغاء صحيح، بخلاف
# `claude.yml` حيث يقطع إجابةً على سؤال المستخدم.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # لا مراجعةَ لمسوّدة — تُراجَع حين تُعلَن جاهزة.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    # 🔴 سقفٌ جامح — الافتراضي بلاه **٣٦٠ دقيقة**.
    timeout-minutes: 30

    # 🔴 `pull-requests: write` إلزاميّ — بـ`read` يعمل الإجراء ثمّ لا ينشر شيئاً
    #    بلا أيّ رسالة خطأ (anthropics/claude-code-action#1562): الفشلُ الصامت بعينه.
    # 🟢 و`contents: read` لا `write` — **المراجعُ لا يدفع**. (‏`claude.yml` يحتاج
    #    `contents: write` لأنه ينفّذ طلباتِ المالك، وهذا يقرأ ويعلّق فقط.)
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # `actions: read` لقراءة سجلّ الوظيفة · و`checks: read` لقراءة تعليقاتها التوضيحية.
      actions: read
      checks: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # 🔴 `continue-on-error` مقصودٌ لا تساهُل: الحكمُ نُقل إلى بوّابة «تعليقٌ منشور»
      #    أدناه — تقرأ **المخرَج** لا لونَ الخطوة، فتُفرّق «لم تُراجَع» عن «راجعت».
      - name: Claude review
        id: review
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            راجع هذا الـPR بالعربية. فرعُ الـPR مسحوبٌ في دليل العمل الحالي.

            اقرأ `.github/claude-context.md` أوّلاً — فيه ثوابتُ هذا المستودع وفئاتُ
            علله المتكرّرة وما **ليس** عطلاً فيه.
            ⚠️ ولا تقرأ `CLAUDE.md` كاملاً إلّا لضرورة — هو مكتوبٌ لجلسة عملٍ كاملة لا
            لمراجعةِ فرقٍ واحد، وقراءتُه هنا هدرٌ بحدّ ذاته.

            🔴 ثوابتُ هذا المستودع — أيُّ خرقٍ لها اعتراضٌ حاجب لا ملاحظة
            (تُكرَّر هنا عمداً ولا يُكتفى بالملفّ: ملفٌّ قد يُحذف أو يُنقل، ومطالبةٌ
            تعتمده وحده تصير جوفاء صامتة):
            1. 🔴 **رؤيةُ المستودع عامّةٌ ولا تُقلَب** — Pages على مستودعٍ خاصٍّ يحتاج
               خطّةً مدفوعة، والحسابُ على Free ⇒ القلبُ يُطفئ الموقعَ لكلّ مستخدم فوراً.
            2. **`frontend/` و`media/` مخرَجٌ مولَّد** — لا يُحرَّر هنا؛ موضعُ الإصلاح
               `school-app-yemen-gas`. وأيُّ تعديلٍ هنا يُدهَس بأوّل CI.
            3. **معرّفاتُ النشر في `var GAS` ثابتةٌ لا تتغيّر** — تكسر الموقعَ
               وتطبيقَي الأندرويد المنشورين معاً. و`GAS.student = GAS.teacher` **مقصود**:
               ثمانيةُ مساراتٍ وسبعُ وجهات.
            4. 🔴 **اسمٌ في `_RESERVED_TOP_PATHS` لا يُحذف** — حذفُه يقلب المسارَ إلى
               مرشَّحِ slug مدرسةٍ فيصير قابلاً للاختطاف، أو إلى ٤٠٤ سلكياً.
            5. 🔴 **`/student` و`/schedule` و`/home-all-school` تبقى تردّ 200** — عقدٌ مع
               **APK منشورٍ لا طريقَ لتحديثه** (ثوابتُ مجمَّدةٌ في التطبيق) لا إهمالٌ.
            6. 🔴 **أيُّ رأسٍ أو تحويلٍ أو سياسةٍ بلا شرطٍ على المضيف تُصيب متجر ركن
               التسوق أيضاً** — `procorners.com` على **نفس الوركر**. وقع فعلاً (HSTS).
            7. **مفتاحُ كاش الحافّة يبدأ بـ`origin`** — إسقاطُه يخدم صفحةً بأصلٍ ليس أصلَها.
            8. **حارسٌ جديد يُختبَر بالطفرة** — و«صفر مطابقة» بلا حالةِ فشلٍ مُثبَتة
               يُعامَل معطوباً لا نظيفاً. وكلُّ فحصٍ يحمل ضابطَه المعاكس.

            ركّز على: أخطاءٍ حقيقية · ثغراتٍ أمنية (SSRF · تسريبِ رأسٍ · تسميمِ كاش) ·
            خلطِ الأصول · **الفشلِ الصامت** · وحرّاسٍ جوفاءَ تمرّ بلا أن تقيس شيئاً.
            ولا تقترح إعادةَ تنسيقٍ ولا تفضيلاتٍ أسلوبية.

            ⚠️ ومراجعتُك **ساكنةٌ لا سلوكية**: `Bash` التنفيذيّ (`node --check` ·
            `node worker/test-routes.js`) خارج أدواتك المسموحة **عمداً** — قرارُ أمنٍ في
            CI (تنفيذٌ على كودِ فرعٍ لم يُدمج) لا تفصيلُ مراجعة. ⇒ **لن تُمسك حارساً
            أجوفَ يمرّ وقتَ التشغيل**، وهي فئةٌ مهيمنةٌ هنا. ولا تُغني مراجعتُك عن
            `node worker/test-routes.js`. قُل ذلك صراحةً، ولا تدّعِ تشغيلاً لم يقع.

            استعمل `gh pr comment` للملاحظة العامّة، و
            `mcp__github_inline_comment__create_inline_comment` (بـ`confirmed: true`)
            للمواضع بعينها. انشر تعليقاتِ GitHub فقط — لا تُخرِج نصَّ المراجعة كرسالة.

          # 🟢 `--model claude-sonnet-5` — مراجعةٌ **ساكنة متكرّرة** ⇒ كسرُ الكلفة بلا
          #    خسارةٍ تُذكر. والاستدعاءُ الصريح بـ`@claude` يبقى على النموذج الكامل.
          # 🔴 و`--allowedTools` بلا أيّ `Bash` تنفيذيّ عدا نداءات `gh pr` القرائية.
          # 🔴 **ولا `--max-turns` إطلاقاً — حدٌّ يمحو لا حدٌّ يَسِم.** قِيس عند الشقيق
          #    أنه يُفشل الخطوةَ **ولو أنجزت المراجعةَ فعلاً** فتُمحى النتيجةُ ويظهر
          #    `fail` لا يُفرَّق عن اعتراضٍ حقيقيّ — وسقط هناك **ثلاثَ مرّاتٍ متتالية**
          #    (‏15 ⇒ 30 ⇒ 45). **والحدُّ الجامحُ الباقي `timeout-minutes` وحدَه.**
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

      # 🟢 بوّابةُ «تعليقٌ منشور» — الحكمُ من **المخرَج** لا من لون الخطوة.
      #    تُغلق فئتين وقعتا فعلاً عند الشقيق: مراجعةٌ اكتملت ثمّ مُحيت بحدٍّ عدديّ ·
      #    وأكشنٌ يتخطّى نفسَه فيخرج `success` بصفر مراجعة.
      # 🔴 **والحكمُ على أثرِ المراجعة لا على رأسِ تعليقها** — الرأسُ لا يفصل: `error`
      #    يظهر على مراجعةٍ منشورةٍ كاملة حين يُفشِلها فحصٌ بعديّ.
      #    والمرساةُ `actions/runs/<run_id>` داخل جسم التعليق تمنع التقاطَ تعليقٍ من
      #    `claude.yml` أو من تشغيلةٍ سابقة على الـPR نفسه.
      # 🔴 **ولا `if:` إطلاقاً — لا `always()` ولا `!cancelled()`.** خطوةُ المراجعة
      #    `continue-on-error` فالبوّابةُ تجري بعدها دائماً؛ ولو سقط `checkout` نفسُه
      #    فبلا `if:` **تُتخطّى البوّابةُ والوظيفةُ حمراءُ بسببها الصحيح**، بينما
      #    `!cancelled()` تُجريها فتُعلن «لم تُراجَع» ⇒ **تشخيصٌ كاذبٌ لعطلٍ في مكانٍ آخر**.
      - name: بوّابة — تعليقُ مراجعةٍ منشور
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.repository.default_branch }}
        run: |
          set -u
          body=""; queried=0
          # إعادةُ محاولةٍ قصيرة: تعليقُ `track_progress` يُحدَّث في آخر لحظة.
          # 🔴 و`if` لا `&&`: الشِلُّ هنا `bash -e`، و`cond && cmd` حين تسقط `cond`
          #    تُنهي السكربتَ بصمت — فتصير البوّابةُ حمراءَ بلا رسالةٍ ولا حكم.
          # 🔴 و`|| true` وحدَه يُخفي فشلَ الاستعلام في هيئة «لا تعليق» — وهما تشخيصان
          #    متعاكسان. فيُلتقَط رمزُ الخروج صراحةً ويُفصَل «تعذّر الاستعلام» عن «لا تعليق».
          for i in 1 2 3; do
            body="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
              --jq "[ .[] | select(.user.login == \"claude[bot]\") | select(.body | contains(\"actions/runs/$RUN_ID\")) ] | last | .body // \"\"")" && rc=0 || rc=$?
            if [ "$rc" = 0 ]; then queried=1; fi
            if [ -n "$body" ]; then break; fi
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          if [ "$queried" = 0 ]; then
            echo "::error::تعذّر الاستعلامُ عن تعليقات الـPR — وهذا **ليس** «لم تُراجَع»: لا حكمَ على المراجعة."
            { echo "### 🔴 تعذّر القياس"; echo "‏\`gh api …/issues/$PR/comments\` أخفق في ثلاث محاولات ⇒ **لا يُقرأ هذا صفرَ مراجعة**."; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          head="${body%%$'\n'*}"
          case "$body" in
            '')
              # 🔴 **يُسمّى السببُ ولا يُعفى منه.** إعفاءٌ يُخضِّر «تخطّي الوركفلو» نُقض
              #    عند الشقيق بحالةٍ تُسقطه: PR يعدّل الوركفلو **ومعه كودٌ آخر** ⇒ يُدمج
              #    بصفر مراجعةٍ **وبأخضرَ يُصدَّق**. و**الأخضرُ المُصدَّق أغلى من الأحمر
              #    المزعج** — فالأحمرُ هنا **صادق**: المراجعةُ لم تجرِ فعلاً.
              # 🔴 **ويُقاس شرطُ التخطّي بعينه** لا خبرٌ عنه: هل نسخةُ هذا الملفّ على رأس
              #    الفرع تختلف عن الفرع الافتراضي؟
              wf=".github/workflows/claude-review.yml"
              sha_head="$(gh api "repos/$REPO/contents/$wf?ref=$HEAD_SHA" --jq '.sha' 2>/dev/null || true)"
              sha_base="$(gh api "repos/$REPO/contents/$wf?ref=$BASE_REF" --jq '.sha' 2>/dev/null || true)"
              wf_differs=0; wf_new=0
              # 🟢 **فرعُ «جديدٌ على الفرع» — فارقٌ عن نسخة الشقيق وإصلاحٌ يُنقَل إليها.**
              #    حين يُنشأ هذا الملفُّ أوّلَ مرّة يكون `sha_base` **فارغاً**، فشرطُ
              #    «مختلفان» يسقط ⇒ الحالةُ تنزل إلى رسالةٍ عامّةٍ **تُخفي السببَ الحقيقيّ**
              #    في أوّلِ تشغيلةٍ بالضبط — أي حيث يكون التشخيصُ أنفعَ ما يكون.
              if [ -n "$sha_head" ] && [ -z "$sha_base" ]; then wf_new=1; wf_differs=1; fi
              if [ -n "$sha_head" ] && [ -n "$sha_base" ] && [ "$sha_head" != "$sha_base" ]; then wf_differs=1; fi
              if [ "$wf_differs" = 1 ]; then
                if [ "$wf_new" = 1 ]; then reason="هذا الـPR **يُنشئ** \`$wf\` ولا وجودَ له على \`$BASE_REF\` بعد"; else reason="هذا الـPR **يعدّل** \`$wf\`"; fi
                echo "::error::لم تُراجَع — الأكشنُ تخطّى نفسَه ($reason). متوقَّعٌ ويعود بعد الدمج، **لكنّ المراجعةَ لم تجرِ** ⇒ الأحمرُ صادق، والدمجُ قرارُ بشرٍ لا لونُ فحص."
                { echo "### 🔴 لم تُراجَع — تخطٍّ بنيويّ (والأحمرُ صادق)"
                  echo "$reason، والأكشنُ يشترط تطابقَ الملفّ مع الفرع الافتراضي ⇒ **يتخطّى نفسَه ويخرج \`success\` بصفر مراجعة**."
                  echo "🔴 **ولا يُخضَّر هذا:** الـPR قد يحمل كوداً آخر مع الوركفلو ⇒ يُدمج بصفر مراجعةٍ وبأخضرَ يُصدَّق."
                  echo "🟢 **التعويض:** شغّل \`node worker/test-routes.js\` محلّياً على الفرع، وادمج بقرارٍ بشريّ صريح. والمراجعةُ الآليّة تعود على أوّل PR بعد الدمج."
                  echo ""
                  echo "\`review-step-outcome\` = \`${{ steps.review.outcome }}\` · \`workflow-file-differs-from-base\` = \`$wf_differs\` · \`workflow-file-is-new\` = \`$wf_new\`"; } >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              echo "::error::لم تُراجَع — صفرُ تعليقٍ منشور من claude[bot] لهذه التشغيلة ($RUN_ID)"
              { echo "### 🔴 لم تُراجَع"
                echo "صفرُ تعليقٍ منشور من \`claude[bot]\` مرتبطٍ بالتشغيلة \`$RUN_ID\`."
                echo ""
                echo "\`review-step-outcome\` = \`${{ steps.review.outcome }}\` · \`workflow-file-differs-from-base\` = \`$wf_differs\` · \`workflow-file-is-new\` = \`$wf_new\`"; } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
            *)
              # 🔴 **الرأسُ وحدَه لا يفصل — قِيس ونُقض عند الشقيق.** رأسُ `**Claude
              #    encountered an error` يظهر على **مراجعةٍ منشورةٍ كاملة** حين يُفشِلها
              #    فحصٌ بعديّ ⇒ الحكمُ بالرأس **يُحمِّر عملاً تمّ**.
              # 🟢 **والفاصلُ المقيس قائمةُ التتبّع وحدَها: `unchecked = 0` و`checked > 0`.**
              #    الشقُّ الثاني يمنع الخضورَ **بالمصادفة** حين لا قائمةَ أصلاً (صفرٌ وصفر)،
              #    فيبقى الحكمُ على **أثرٍ موجب** لا على غيابِ إشارة.
              # 🔴 **ولا `reviews` ولا الرأسُ في الحكم — كلاهما مشروطٌ بالمستودع** ⇒
              #    يُطبَعان **خبراً لا حكماً**. (القاعدةُ مقيسةٌ عند الشقيق على خمس حالات.)
              unchecked="$(printf '%s' "$body" | grep -c -- '- \[ \]' || true)"
              checked="$(printf '%s' "$body" | grep -c -- '- \[x\]' || true)"
              reviews="$(gh api "repos/$REPO/pulls/$PR/reviews" \
                --jq '[ .[] | select(.user.login == "claude[bot]") ] | length' 2>/dev/null || echo 0)"
              # 🟢 **`separate-comments` خبرٌ لا حكم — وهذا مقصودٌ لا نقص.** المراجعةُ قد
              #    تُنشر **تعليقاً منفصلاً بلا رابطِ تشغيلة** فلا تراه المرساة.
              # 🔴 **ولا يُجعَل شرطاً أخضرَ:** `claude.yml` يُنشئ **نفسَ الشكل** لأيّ جوابٍ
              #    على `@claude` ⇒ الشرطُ يُخضِّر فحصاً **لم تجرِ فيه مراجعةٌ قطّ**.
              sep="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                --jq "[ .[] | select(.user.login == \"claude[bot]\") | select((.body | contains(\"actions/runs/\")) | not) | select((.body | length) >= 500) ] | length" 2>/dev/null || echo 0)"
              facts="\`unchecked\` = \`$unchecked\` · \`checked\` = \`$checked\` · \`reviews\` = \`$reviews\` · \`separate-comments\` = \`$sep\` (الثلاثةُ الأخيرة **خبرٌ لا حكم**) · \`review-step-outcome\` = \`${{ steps.review.outcome }}\`"
              if [ "$unchecked" = 0 ] && [ "$checked" -gt 0 ]; then
                case "$body" in
                  '**Claude finished'*) : ;;
                  *) echo "::warning::رأسُ التعليق ليس \`**Claude finished\` لكنّ المراجعةَ منشورةٌ كاملة ($checked مؤشَّر · 0 غيرُ مؤشَّر) — الرأسُ لا يفصل." ;;
                esac
                echo "🟢 مراجعةٌ منشورة — $head"
                { echo "### 🟢 مراجعةٌ منشورة"; echo "$head"; echo ""; echo "$facts"; } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::error::لم تكتمل المراجعة — $unchecked بنداً غيرَ مؤشَّر و$checked مؤشَّراً. $head"
              { echo "### 🔴 لم تكتمل المراجعة"; echo "$head"; echo ""; echo "$facts"; } >> "$GITHUB_STEP_SUMMARY"
              exit 1 ;;
          esac
