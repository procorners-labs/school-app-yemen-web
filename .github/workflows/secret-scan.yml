name: Secret scan

# لماذا هذا الملفّ موجود
# ─────────────────────
# هذا المستودع **عامّ ويجب أن يبقى كذلك** (‏GitHub Pages يخدم منه الموقع الحيّ)،
# وGitHub يفحص المستودعات العامّة افتراضياً بأنماط الشركاء (partner patterns).
# ⇒ هذا الوركفلو **لا يملأ فراغاً تامّاً**، ويُقال ذلك صراحةً بدل الإيهام بحمايةٍ
# لم تكن غائبة. وما يضيفه فعلاً ثلاثة:
#
#   ① **عائلاتٌ ليست أنماطَ شريك** — سرُّ الوسيط (`x-relay-key`) و`storePassword=`.
#   ② **بوّابةٌ على الـPR قبل الدمج** لا تنبيهاً بعده — والفرقُ جوهريّ هنا تحديداً
#      لأن الدمج في `main` **يَنشُر حيّاً فوراً**.
#   ③ 🔴 **تغطيةُ المسار الذي لا يمرّ بعينٍ بشرية**: هذا المستودع يتلقّى دفعاً آلياً
#      مباشراً من CI الـGAS عبر DEPLOY_PAT — ومحتوى `frontend/` مُولَّد، فلا يراجعه أحد.

on:
  push:
  pull_request:
  workflow_dispatch:

# قراءة فقط — الفحص لا يكتب شيئاً، ولا يحتاج أكثر من ذلك.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          # التاريخ الكامل لازم: الفحص يعمل على **مدى كوميتات** لا على ملفّات العمل،
          # والاستنساخ الضحل يجعل أي مدى غير قابل للحلّ.
          fetch-depth: 0

      # ثنائيٌّ مثبَّتٌ بنسخةٍ صريحة + تحقّقُ بصمة. لا إجراء طرف ثالث:
      # gitleaks-action يشترط GITLEAKS_LICENSE للمنظمات، وربطُ حاجزِ الأسرار
      # بترخيصٍ خارجي يجعله يسقط صامتاً يوم ينتهي.
      - name: Install gitleaks (pinned + checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${f}"
          echo "${GITLEAKS_SHA256}  ${f}" | sha256sum -c -
          tar -xzf "$f" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 🔴 المدى مقصودٌ ولا يُوسَّع إلى التاريخ الكامل في التشغيل التلقائي.
      # السبب مقيس: تسريباتٌ **باقيةٌ في التاريخ** حتى تُدوَّر مفاتيحُها ⇒ فحصُ التاريخ
      # الكامل على كل دفعة يجعل الحارس **أحمرَ أبداً**، فيُتجاهَل — وحارسٌ يُتجاهَل أسوأ
      # من غيابه. ⇒ التلقائي يحرس **الجديد**، والتاريخ الكامل يُفحص يدوياً
      # بـworkflow_dispatch.
      - name: Resolve scan range
        id: range
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              echo "opts=--log-opts=${base}..${head}" >> "$GITHUB_OUTPUT"
              echo "scope=كوميتات الـPR (${base:0:7}..${head:0:7})" >> "$GITHUB_OUTPUT"
              ;;
            push)
              before="${{ github.event.before }}"
              # فرعٌ جديد أو دفعٌ قسريّ ⇒ before أصفارٌ كلُّه، والمدى غير قابل للحلّ.
              # عندها نفحص آخر كوميت وحده بدل الوقوع في خطأ يبدو «فشل حارس».
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
                echo "opts=--log-opts=-1" >> "$GITHUB_OUTPUT"
                echo "scope=آخر كوميت (لا سلفَ قابلاً للحلّ)" >> "$GITHUB_OUTPUT"
              else
                echo "opts=--log-opts=${before}..${{ github.sha }}" >> "$GITHUB_OUTPUT"
                echo "scope=كوميتات الدفعة (${before:0:7}..${GITHUB_SHA:0:7})" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "opts=" >> "$GITHUB_OUTPUT"
              echo "scope=التاريخ الكامل — تدقيقٌ يدويّ" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # --redact إلزاميّ: لا تُطبع قيمةُ سرٍّ في أي مخرَج — وسجلّات الإجراءات في مستودعٍ
      # **عامّ** مقروءةٌ للجميع، فالقاعدة هنا أشدّ لزوماً. gitleaks يطبع الموضع والنوع فقط.
      - name: Scan
        run: |
          set -euo pipefail
          echo "::notice::نطاق الفحص — ${{ steps.range.outputs.scope }}"
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose \
            --exit-code 2 \
            ${{ steps.range.outputs.opts }}

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::رُصد سرٌّ محتمل. القيمة **لم تُطبع** عمداً (--redact)."
          echo "لا تدفع إصلاحاً يزيل السطر فقط: ما دخل التاريخ يبقى صالحاً حتى يُدوَّر."
          echo "① دوّر المفتاح في لوحته  ② انقله إلى متغيّر بيئة/سرّ  ③ سجّله في pending.json"
          echo "وإن كان إيجاباً كاذباً: أضِف بصمة الرصد إلى .gitleaksignore بسطرٍ يشرح لماذا."
