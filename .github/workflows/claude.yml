name: Claude Code

# استدعاءٌ عند الطلب بـ`@claude` في تعليق أو عدد.
# ⚠️ ولا يوجد `claude-review.yml` هنا **عمداً**: هذا المستودع يتلقّى دفعاً آلياً
#    مباشراً من CI الـGAS (‏`DEPLOY_PAT`) لا PRs ⇒ مراجعةٌ عند فتح PR بلا مادّة.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # 🔴 `assigned` أُسقط عمداً 2026-08-30: كان مُشغَّلاً والشرطُ أدناه يفحص **نصّ** العدد
  #    وعنوانه وحدهما ⇒ إسنادُ عدد بلا `@claude` في نصّه لا يشغّل شيئاً (تخطٍّ صامت).
  #    قدرةٌ معلَنة لا تعمل **أسوأ من غيابها** — لأنها تُقرأ ضماناً قائماً.
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

# 🔴 تسلسلٌ لا إلغاء — أُضيف 2026-08-30. قبله كان تعليقان متتاليان بـ`@claude` يشغّلان
#    مهمّتين متوازيتين على نفس حصّة الاشتراك.
#    و`cancel-in-progress: false` عمداً: إجابةٌ جاريةٌ على سؤالك لا تُلغى بسؤالك التالي.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    # 🔴 سقفٌ جامح — الافتراضي بلا هذا السطر **٣٦٠ دقيقة**. متوسّط التشغيلة الناجحة
    #    ٢٠٠ ثانية (مقيس على ١٢ تشغيلة/٧ أيام) ⇒ ٢٠ دقيقة هامشٌ ×٦.
    timeout-minutes: 20

    # 🔴 `write` وليس `read` — صُحِّح 2026-08-29.
    # عطبُ `read` موثَّقٌ رسمياً: anthropics/claude-code-action#1562 — الإجراء يعمل ثمّ
    # **لا ينشر تعليقاً ولا مراجعة، بلا أي رسالة خطأ**.
    # ⚠️ ودقّةٌ تُقال: هذه الكتلة تحكم `GITHUB_TOKEN` وحده؛ ومع تثبيت تطبيق Claude
    # يأتي حقُّ الكتابة من توكن التطبيق — ولذلك نجحت تشغيلةُ #147 هنا رغم `read`.
    # ⇒ العطلُ كان **كامناً لا واقعاً**، والترقية تُغلق الفئة لا حادثةً.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # ليقرأ Claude نتائج CI على الـPRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          # ٩٨ من آخر ١٠٠ تعليق على PRs هذا الحساب من chatgpt-codex-connector[bot]،
          # ونصُّها واحدٌ مكرّر: «You have reached your Codex usage limits» (قِيس 2026-08-29).
          # هذا يستبعدها من **سياق** Claude فلا تُقرأ ولا تُستهلَك توكناتُها.
          # 🟢 والسطر يبقى بعد تعطيل البوت ولا يُحذف: تعليقاتُه التاريخية لم تُحذف.
          #    أُعيد القياس 2026-08-30: آخرُ تعليقٍ منه `2026-08-29T18:40:46Z` ثمّ صمتٌ تامّ.
          # ⚠️ وليس حارساً ضدّ استدعاء البوتات — ذاك مضمونٌ أصلاً بافتراض `allowed_bots: ""`.
          # 🔴 ولا يُوسَّع إلى `*[bot]`: تعليقات github-actions[bot] تحمل نتائجَ فحوصٍ
          #    قد يحتاجها Claude، واستبعادُها يُفقره بلا مقابل.
          exclude_comments_by_actor: "chatgpt-codex-connector[bot]"

          # 🔴 لا مدخل `model:` ولا `max_turns:` مستقلّ في v1 — كلاهما عبر `claude_args`
          #    حصراً، وهما **الطريقان الموثَّقان الوحيدان** لخفض الكلفة (لا `max_cost`).
          # 🟢 وبلا `--model` عمداً: استدعاءٌ صريحٌ ونادر يستحقّ النموذج الكامل.
          claude_args: |
            --max-turns 25
