name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 🔴 `false` وليس `true` — صُحِّح 2026-08-29.
# دفعتان متقاربتان إلى main كانتا تُلغيان النشرة الأولى **في منتصفها**، فيبقى الموقع
# الحيّ على نسخةٍ قديمة و**كلُّ شيء يبدو ناجحاً**. وهذا حرفياً العطلُ الموثَّق في
# school-app-yemen-gas/.github/workflows/build-and-deploy.yml (بند 100-هـ) الذي
# استُثني main من الإلغاء بسببه — والدرسُ لم يكن قد نُقل إلى المستودع الذي ينشر فعلاً.
# وهو أيضاً ما توصي به GitHub لنشر Pages: لا يُلغى نشرٌ جارٍ.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # ننشر مجلد frontend/ فقط (الواجهة الثابتة)
          path: ./frontend
      - id: deployment
        uses: actions/deploy-pages@v4
