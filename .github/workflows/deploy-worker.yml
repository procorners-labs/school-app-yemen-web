name: Deploy Worker to Cloudflare

# بديل نشر يدوي قائم على توكن لـ Cloudflare Workers Builds.
# ملاحظة (2026-06-29): مسار النشر التلقائي الحتمي صار **Cloudflare Workers Builds**
# بعد إصلاح سببه الجذري (إفراغ "Build command" الذي كان "npm run build" بلا package.json).
# Workers Builds ينشر تلقائياً على كل push إلى main عبر مصادقة الحساب — بلا توكن.
# لذا هذا الـworkflow يدوي فقط (workflow_dispatch) لتفادي نشرٍ مزدوج، ويبقى احتياطياً.
# لتفعيله يدوياً يلزم سرّان: CLOUDFLARE_API_TOKEN (صلاحية Account › Workers Scripts › Edit)
# و CLOUDFLARE_ACCOUNT_ID (e08b4b9ead7a4f1e7458bded98f35dd4). يقرأ الإعداد من wrangler.jsonc.

on:
  workflow_dispatch:

# قراءة فقط — wrangler يصادق عبر السرّين لا عبر GITHUB_TOKEN
permissions:
  contents: read

# منع نشرين متزامنين على نفس الـWorker (بلا إلغاء نشرٍ جارٍ)
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # wrangler@latest يتطلّب Node >= 22 (وإلا: "Wrangler requires at least Node.js v22")
          node-version: 22

      - name: Deploy Worker (wrangler)
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
