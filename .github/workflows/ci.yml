name: Validate Worker & Frontend

# الـfrontend/ يُبنى ويُرسَل تلقائياً من school-app-yemen-gas عبر DEPLOY_PAT
# هذا الـCI يتحقّق فقط من صحة كود الـWorker وبنية الـfrontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# دفعتان متتاليتان على نفس الفرع تُنتجان تشغيلتين، والأولى تختبر كوداً تجاوزَه الثاني
# ⇒ دقائق مهدورة بلا معلومة. أُضيف 2026-08-29 بنفس صيغة build-and-deploy.yml في
# مستودع الـGAS حرفياً، فلا تتباعد السياستان بين المستودعين المقترنين بـCI.
# 🔴 والاستثناء على main مقصود ولا يُزال: إلغاء تشغيلة main يُلغي التحقّق من الحالة
# التي يُخدَم منها الموقع فعلاً — والفشلُ هناك صامت.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Worker JS syntax
        run: node --check worker/school-app-proxy.js

      # `node --check` يُثبت أن الملف يُحلَّل نحوياً لا أن مساراً يذهب حيث نظنّ. أُضيف
      # 2026-08-10 بعد اكتشاف أن `/portal` كان يُرجِع 200 ويُخدَم كـslug مدرسة بصمت.
      - name: Check Worker routing
        run: node worker/test-routes.js

      # backtick داخل كتلة `run:` يُنفَّذ كأمر لا يُطبع كنصّ — وأثرُه فشلٌ صامتٌ داخل
      # رسالة الفشل نفسِها (رسالةٌ تفقد مضمونَها وخطوةٌ تخرج بحالتها المقصودة). ولا
      # يكشفه `bash -n`: استبدالُ الأمر صحيحٌ نحوياً. الكاشفُ والضابطُ ثنائيُّ القطب معاً
      # في السكربت — يُلاحق **غيرَ المهرَّب** وحدَه ويستثني التعليقَ و`$(...)` المقصود،
      # وإلّا أنذر كاذباً دائماً فيُتجاهَل ⇒ سياجٌ لا حارس.
      - name: Check run-block backticks
        run: node .github/scripts/check-run-backticks.js

      # 🔴 بوّابةُ «تعليقٌ منشور» في `claude-review.yml` هي ما يفرّق «راجعت» من «لم تُراجَع»،
      # والفئةُ المخيفةُ فيها **الأخضرُ المُصدَّق**. وضابطُها كان موجوداً **بصفر استدعاءٍ من
      # أيّ وركفلو** حتى 2026-09-10 ⇒ **ضابطٌ قائمٌ لا يجري = أخضرٌ مُصدَّق** — وهي الفئةُ
      # نفسُها التي كُتب لأجلها. ⇒ يُوصَل هنا لا يُترَك لتشغيلٍ يدويٍّ يُنسى.
      # 🟢 ويُشغَّل على **نصّ البوّابة نفسِه** (استخراجُ `run:` وتنفيذُه مع `gh` مُزيَّف)
      # فلا تتباعد نسخةُ منطقٍ عن الأصل؛ ويخرج بـ`2` لتعذّر القياس فلا يُقرأ صفرُ حالاتٍ سلامةً.
      - name: Probe review gate
        run: node .github/scripts/probe-review-gate.js

      - name: Verify frontend directory exists
        run: |
          if [ ! -d "frontend" ]; then
            echo "::error::مجلد frontend/ مفقود — يُبنى تلقائياً من school-app-yemen-gas"
            exit 1
          fi
          echo "frontend/ موجود ✓ ($(ls frontend | wc -l) مجلدات فرعية)"
