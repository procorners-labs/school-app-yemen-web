name: Validate Worker & Frontend

# الـfrontend/ يُبنى ويُرسَل تلقائياً من school-app-yemen-gas عبر DEPLOY_PAT
# هذا الـCI يتحقّق فقط من صحة كود الـWorker وبنية الـfrontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Worker JS syntax
        run: node --check worker/school-app-proxy.js

      # `node --check` يُثبت أن الملف يُحلَّل نحوياً لا أن مساراً يذهب حيث نظنّ. أُضيف
      # 2026-08-10 بعد اكتشاف أن `/portal` كان يُرجِع 200 ويُخدَم كـslug مدرسة بصمت.
      - name: Check Worker routing
        run: node worker/test-routes.js

      - name: Verify frontend directory exists
        run: |
          if [ ! -d "frontend" ]; then
            echo "::error::مجلد frontend/ مفقود — يُبنى تلقائياً من school-app-yemen-gas"
            exit 1
          fi
          echo "frontend/ موجود ✓ ($(ls frontend | wc -l) مجلدات فرعية)"
