<script>
/**
 * ═══════════════════════════════════════════════════════════════════════
 *  _DeploymentClient.js — عميل الروابط الموحّد (يُحمَّل في كل صفحة)
 *  ─────────────────────────────────────────────────────────────────────
 *  يُوفّر:
 *    - DeploymentClient.init(callback) → جلب الروابط من الخادم وحفظها
 *    - DeploymentClient.url(name)      → الحصول على رابط منصة (sync بعد init)
 *    - DeploymentClient.go(name, page) → الانتقال الذكي مع دعم Android
 *    - DeploymentClient.ready          → true عند اكتمال التحميل
 *  ─────────────────────────────────────────────────────────────────────
 *  متوافق مع:
 *    ✅ Google Apps Script HTML Service (iframe sandbox)
 *    ✅ Android WebView (TeacherActivity, StudentActivity, MainActivity)
 *    ✅ متصفح ويب عادي
 *    ✅ ES5 (لا arrow functions، لا template literals)
 * ═══════════════════════════════════════════════════════════════════════
 */
(function(global) {
  'use strict';

  // مفتاح localStorage للكاش الجانبي (24 ساعة)
  var LS_KEY = '__deploy_urls_v2';
  var LS_TTL = 24 * 60 * 60 * 1000; // 24 ساعة

  // الحالة
  var _urls    = null;
  var _ready   = false;
  var _waiters = [];
  var _isAndroid = false;

  // كشف بيئة Android WebView (لمعالجة base target=_top)
  try {
    var ua = navigator.userAgent || '';
    _isAndroid = (ua.indexOf('wv') !== -1) ||
                 (ua.indexOf('SchoolAppYemen') !== -1) ||
                 (ua.indexOf('Android') !== -1 && ua.indexOf('Chrome') !== -1 && ua.indexOf('Version/') !== -1);
  } catch(e) { _isAndroid = false; }

  /**
   * تهيئة العميل — تُستدعى مرة واحدة عند تحميل الصفحة
   * @param {Function} callback - تُنادى عند اكتمال جلب الروابط
   */
  function init(callback) {
    if (_ready) {
      if (typeof callback === 'function') callback(_urls);
      return;
    }
    if (typeof callback === 'function') _waiters.push(callback);

    // 1. محاولة استخدام كاش localStorage أولاً (سرعة فورية)
    var cached = _readCache();
    if (cached) {
      _urls = cached;
      _ready = true;
      _flushWaiters();
      // متابعة التحديث في الخلفية
      _fetchFromServer(true);
      return;
    }

    // 2. لا كاش — انتظار الخادم
    _fetchFromServer(false);
  }

  /**
   * جلب الروابط من Apps Script
   * @param {boolean} silent - لو true، التحديث في الخلفية بدون استدعاء waiters
   */
  function _fetchFromServer(silent) {
    try {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        // بيئة لا تدعم google.script.run — استخدم الافتراضي
        if (!_ready) {
          _urls = _fallbackUrls();
          _ready = true;
          _flushWaiters();
        }
        return;
      }

      google.script.run
        .withSuccessHandler(function(data) {
          if (data && typeof data === 'object') {
            _urls = data;
            _writeCache(data);
            if (!silent) {
              _ready = true;
              _flushWaiters();
            }
          } else if (!silent) {
            _urls = _fallbackUrls();
            _ready = true;
            _flushWaiters();
          }
        })
        .withFailureHandler(function(err) {
          if (!silent) {
            _urls = _fallbackUrls();
            _ready = true;
            _flushWaiters();
          }
          try { console.warn('DeploymentClient: server fetch failed', err); } catch(e) {}
        })
        .getDeploymentUrls();
    } catch (e) {
      if (!silent) {
        _urls = _fallbackUrls();
        _ready = true;
        _flushWaiters();
      }
    }
  }

  /**
   * الحصول على رابط منصة محدّدة
   * @param {string} name - home, cms, teacher, student, schedule, master
   * @returns {string} الرابط أو فارغ
   */
  function url(name) {
    if (!_urls) return '';
    return _urls[name] || '';
  }

  /**
   * انتقال ذكي إلى منصة — متوافق مع Android والمتصفح
   * @param {string} name - اسم المنصة
   * @param {string} page - صفحة فرعية (اختياري) مثل '?page=add'
   */
  function go(name, page) {
    var doGo = function() {
      var u = url(name);
      if (!u) {
        try { console.error('DeploymentClient: unknown deployment "' + name + '"'); } catch(e) {}
        return;
      }
      if (page) {
        u += (u.indexOf('?') > -1 ? '&' : '?') + 'page=' + encodeURIComponent(page);
      }
      _navigate(u);
    };

    if (_ready) {
      doGo();
    } else {
      // انتظر اكتمال init ثم انتقل
      _waiters.push(function() { doGo(); });
      // ضمان إطلاق init لو لم يُستدعَ
      init();
    }
  }

  /**
   * انتقال آمن متوافق مع Android WebView و iframe
   */
  function _navigate(targetUrl) {
    if (!targetUrl) return;
    try {
      if (window.top && window.top !== window) {
        window.top.location.href = targetUrl;
      } else {
        window.location.href = targetUrl;
      }
    } catch (err) {
      // عند منع cross-origin (نادر) — fallback
      try { window.location.href = targetUrl; } catch(e) {}
    }
  }

  /**
   * تنفيذ جميع الـ callbacks المُنتظِرة
   */
  function _flushWaiters() {
    var ws = _waiters.slice();
    _waiters = [];
    for (var i = 0; i < ws.length; i++) {
      try { ws[i](_urls); } catch(e) {}
    }
  }

  /**
   * قراءة الكاش من localStorage
   */
  function _readCache() {
    try {
      if (!global.localStorage) return null;
      var raw = global.localStorage.getItem(LS_KEY);
      if (!raw) return null;
      var obj = JSON.parse(raw);
      if (!obj || !obj.ts || !obj.data) return null;
      if ((new Date().getTime() - obj.ts) > LS_TTL) return null;
      return obj.data;
    } catch (e) { return null; }
  }

  /**
   * كتابة الكاش في localStorage
   */
  function _writeCache(data) {
    try {
      if (!global.localStorage) return;
      global.localStorage.setItem(LS_KEY, JSON.stringify({
        ts: new Date().getTime(),
        data: data
      }));
    } catch (e) {}
  }

  /**
   * روابط افتراضية في حال فشل كل شيء
   */
  function _fallbackUrls() {
    return {
      home:     'https://script.google.com/macros/s/AKfycbzDfGEK6IpChVNl9k8xbt_iv5p6bLOktt-TvEzDp8yBpH3Ga3yNMen_0S2ZyuuvGtKFCA/exec',
      cms:      'https://script.google.com/macros/s/AKfycbz-iAj9L3ROOn4CAjmwkVBUqpWuxIx1LkgPLwKnHu7kHLWKCy3GVJNo1vZbnekop0VlMA/exec',
      teacher:  'https://script.google.com/macros/s/AKfycbwbiM1NdYlHf4XPpeftVcrJPmcrPJWm7KS2sSL4qtzZDMDtYo4sGdx6T-p8fAIArvND/exec',
      student:  'https://script.google.com/macros/s/AKfycbz6wFJBq6RUg7buXM5LIGfEa4eVXZguPeIyrkg-T-kbOUhWlJMypO3Ame6lmcHzdcwq/exec',
      schedule: 'https://script.google.com/macros/s/AKfycbwbsWcoOZ23TUWDtxVTV1RyG2LJ7IYWTWuk9Jt-15OeB1JgqRIyGSRxZo3NB8ZI2ag/exec',
      master:   'https://script.google.com/macros/s/AKfycbx5H6uYXb-6iVt_nT4YkdnYMhl6eZJSDxsULsKa2eyblZQcwzRo4CXR3Mh_ecRSZd4M/exec'
    };
  }

  /**
   * معالجة base target=_top داخل WebView (إصلاح القائمة الجانبية)
   */
  function _patchBaseTagForAndroid() {
    if (!_isAndroid) return;
    try {
      var baseTag = document.querySelector('base[target]');
      if (baseTag) baseTag.removeAttribute('target');
    } catch (e) {}
  }

  // تنفيذ patch فور تحميل DOM
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _patchBaseTagForAndroid);
  } else {
    _patchBaseTagForAndroid();
  }

  // التهيئة التلقائية (لا داعي لاستدعاء init يدوياً)
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() { init(); });
  } else {
    init();
  }

  // تصدير API للنطاق العام
  global.DeploymentClient = {
    init:      init,
    url:       url,
    go:        go,
    ready:     function() { return _ready; },
    isAndroid: function() { return _isAndroid; },
    refresh:   function(cb) {
      _ready = false;
      try { global.localStorage.removeItem(LS_KEY); } catch(e) {}
      init(cb);
    }
  };
})(window);
</script>
